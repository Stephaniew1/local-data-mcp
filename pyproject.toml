[project]
name = "local-data-mcp"
version = "0.1.0"
description = "MCP server exposing a local SQLite database to LLM clients as structured, read-only tools"
readme = "README.md"
authors = [
    { name = "Stephanie Wainaina", email = "wainaina.stephaniew@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
]

[project.scripts]
local-data-mcp = "local_data_mcp:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
